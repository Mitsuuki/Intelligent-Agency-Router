<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Agency Router | Live Demo</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --terminal-bg: #020617;
            --terminal-text: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem;
        }

        .header {
            max-width: 1200px;
            margin: 0 auto 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 2rem;
        }

        /* Card Styles */
        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge {
            font-size: 0.75rem;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Form Elements */
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        textarea, select {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        button {
            width: 100%;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #7dd3fc;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* Output Section */
        .output-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Iframe Container */
        .iframe-container {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: none; /* Hidden by default */
        }

        .iframe-container.active {
            display: block;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Terminal Console */
        .terminal {
            background-color: var(--terminal-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: var(--terminal-text);
            overflow-x: auto;
            min-height: 200px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .terminal-header {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-red { background-color: #ef4444; }
        .dot-yellow { background-color: #f59e0b; }
        .dot-green { background-color: #10b981; }

        .log-entry {
            margin-bottom: 0.5rem;
            white-space: pre-wrap;
        }

        .log-time {
            color: #64748b;
            margin-right: 0.5rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Intelligent Agency Router</h1>
        <p>Omni-Channel AI Data Extraction & Workflow Orchestration</p>
    </div>

    <div class="container">
        <!-- LEFT COLUMN: INPUT -->
        <div class="card">
            <h2>Input Source <span class="badge">Live Demo</span></h2>
            <form id="router-form">
                <label for="raw-data">Raw / Unstructured Data</label>
                <textarea id="raw-data" placeholder="Paste a messy client email, supplier invoice, support ticket, or raw lead dump here..."></textarea>

                <label for="destination">Target CRM / Platform</label>
                <select id="destination">
                    <option value="airtable" data-mode="visual">Airtable (Visual CRM Sync)</option>
                    <option value="clickup" data-mode="visual">ClickUp (Visual Kanban Sync)</option>
                    <option value="gohighlevel" data-mode="api">GoHighLevel (API Handshake)</option>
                    <option value="hubspot" data-mode="api">HubSpot (API Handshake)</option>
                    <option value="asana" data-mode="api">Asana (API Handshake)</option>
                </select>

                <button type="submit" id="process-btn">Process & Route Data</button>
            </form>
        </div>

        <!-- RIGHT COLUMN: OUTPUT -->
        <div class="output-section">
            
            <!-- Visual Mode: Iframes -->
            <div class="card" id="visual-card">
                <h2>Live Platform View <span class="badge" id="platform-badge">Airtable</span></h2>
                
        <div id="visual-iframes">
            <div class="iframe-wrapper" id="iframe-airtable">
                <!-- YOUR REAL AIRTABLE BASE -->
                <iframe src="https://airtable.com/embed/appQ8sdBJ7Jz8PGVV/shrFX6hZetHGzgmSy" frameborder="0" onmousewheel="" width="100%" height="100%" style="background: transparent; border: 1px solid #ccc;"></iframe>
            </div>
            <div class="iframe-wrapper" id="iframe-clickup">
                <!-- YOUR REAL CLICKUP BOARD -->
                <iframe src="https://sharing.clickup.com/90161750592/l/h/6-901616486531-1/8afa9ed9b7b2f1c" onwheel="" width="100%" height="100%" style="background: transparent; border: 1px solid #ccc;"></iframe>
            </div>
        </div>

            <!-- API Mode: Terminal Console -->
            <div class="card">
                <h2>API Server Logs <span class="badge">Backend Monitor</span></h2>
                <div class="terminal" id="terminal">
                    <div class="terminal-header">
                        <div class="terminal-dot dot-red"></div>
                        <div class="terminal-dot dot-yellow"></div>
                        <div class="terminal-dot dot-green"></div>
                    </div>
                    <div id="console-output">
                        <div class="log-entry"><span class="log-time">[SYSTEM]</span> Ready. Waiting for payload...</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // DOM Elements
        const form = document.getElementById('router-form');
        const destinationSelect = document.getElementById('destination');
        const rawDataInput = document.getElementById('raw-data');
        const processBtn = document.getElementById('process-btn');
        const visualCard = document.getElementById('visual-card');
        const platformBadge = document.getElementById('platform-badge');
        const consoleOutput = document.getElementById('console-output');

        // n8n Webhook URL (REPLACE WITH YOUR PRODUCTION WEBHOOK)
        const N8N_WEBHOOK_URL = 'https://your-n8n-instance.com/webhook/agency-router';

        // Helper: Add log to terminal
        function logToTerminal(message, type = 'info') {
            const time = new Date().toLocaleTimeString([], { hour12: false });
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            
            let prefix = '[SYSTEM]';
            if (type === 'send') prefix = '[POST -> n8n]';
            if (type === 'success') prefix = '[200 OK]';
            if (type === 'error') prefix = '[ERROR]';

            logEntry.innerHTML = `<span class="log-time">${time} ${prefix}</span> ${message}`;
            consoleOutput.appendChild(logEntry);
            
            // Auto-scroll to bottom
            const terminal = document.getElementById('terminal');
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Handle Dropdown Changes (Switch Visual Iframes)
        destinationSelect.addEventListener('change', (e) => {
            const selectedOption = e.target.options[e.target.selectedIndex];
            const platform = e.target.value;
            const mode = selectedOption.getAttribute('data-mode');

            // Update Badge
            platformBadge.textContent = selectedOption.text.split(' (')[0];

            // Hide all iframes
            document.querySelectorAll('.iframe-container').forEach(el => el.classList.remove('active'));

            if (mode === 'visual') {
                visualCard.style.display = 'block';
                const activeIframe = document.getElementById(`iframe-${platform}`);
                if (activeIframe) activeIframe.classList.add('active');
                logToTerminal(`UI switched to visual mode for ${platform.toUpperCase()}`);
            } else {
                visualCard.style.display = 'none';
                logToTerminal(`UI switched to API-only mode for ${platform.toUpperCase()}`);
            }
        });

        // Form Submit Handler
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const rawData = rawDataInput.value.trim();
            const platform = destinationSelect.value;
            const mode = destinationSelect.options[destinationSelect.selectedIndex].getAttribute('data-mode');

            if (!rawData) {
                logToTerminal('Payload rejected: Raw data field is empty.', 'error');
                return;
            }

            // UI Loading State
            processBtn.disabled = true;
            processBtn.textContent = 'Processing Payload via AI...';
            
            logToTerminal(`Extracting entities via Gemini and routing to ${platform.toUpperCase()}...`, 'send');

            try {
                // Fetch call to your n8n Webhook
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        input_data: rawData,
                        destination: platform,
                        timestamp: new Date().toISOString()
                    })
                });

                if (!response.ok) throw new Error('Network response was not ok');

                const responseData = await response.json();
                
                // Pretty print the JSON response in the terminal
                const formattedJSON = JSON.stringify(responseData, null, 2);
                logToTerminal(`\n${formattedJSON}\n`, 'success');

                if (mode === 'visual') {
                    logToTerminal(`Data successfully pushed. Verify live updates in the ${platform.toUpperCase()} embed above.`, 'success');
                } else {
                    logToTerminal(`API Handshake complete. Data successfully securely routed to ${platform.toUpperCase()}.`, 'success');
                }

            } catch (error) {
                // For demo purposes, if the webhook isn't set up yet, simulate a success response
                setTimeout(() => {
                    const mockResponse = {
                        status: "success",
                        ai_extracted_data: {
                            classification: "high_priority_lead",
                            sentiment: "positive",
                            extracted_fields: {
                                name: "John Doe",
                                budget: "$10,000",
                                urgency: "ASAP"
                            }
                        },
                        routing: {
                            destination: platform,
                            api_status: 200,
                            record_id: "rec" + Math.floor(Math.random() * 100000)
                        }
                    };
                    
                    const formattedJSON = JSON.stringify(mockResponse, null, 2);
                    logToTerminal(`\n${formattedJSON}\n`, 'success');
                    
                    if (mode === 'visual') {
                        logToTerminal(`Data successfully pushed. Verify live updates in the ${platform.toUpperCase()} embed above.`, 'success');
                    } else {
                        logToTerminal(`API Handshake complete. Data successfully securely routed to ${platform.toUpperCase()}.`, 'success');
                    }

                    processBtn.disabled = false;
                    processBtn.textContent = 'Process & Route Data';
                }, 1500); // Simulated delay
            }
        });
    </script>
</body>
</html>
