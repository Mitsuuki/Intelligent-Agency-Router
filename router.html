<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Agency Router | AI Backend Ops</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap');
        
        :root {
            --bg-main: #020617; /* Slate 950 */
            --bg-panel: #0f172a; /* Slate 900 */
            --bg-surface: #1e293b; /* Slate 800 */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6; /* Blue 500 */
            --accent-hover: #2563eb;
            --success: #10b981;
            --border: #334155;
            --terminal-bg: #000000;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        header { padding: 20px 40px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .logo { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
        .logo svg { color: var(--accent); width: 24px; height: 24px; }
        .status-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--success); background: rgba(16, 185, 129, 0.1); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.2); }
        .pulse { width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 10px var(--success); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* Main Workspace */
        .workspace { display: flex; flex: 1; overflow: hidden; }
        
        /* Left Panel - Controls */
        .control-panel { width: 450px; background: var(--bg-panel); border-right: 1px solid var(--border); padding: 30px; display: flex; flex-direction: column; gap: 24px; overflow-y: auto; }
        .panel-title { font-size: 18px; font-weight: 600; margin: 0; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        textarea { width: 100%; height: 180px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); padding: 16px; font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.5; resize: none; transition: border 0.3s; }
        textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        
        select { width: 100%; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); padding: 12px 16px; font-family: 'Inter', sans-serif; font-size: 14px; appearance: none; cursor: pointer; transition: border 0.3s; }
        select:focus { outline: none; border-color: var(--accent); }

        /* Feature Toggles */
        .toggles { display: flex; flex-direction: column; gap: 12px; background: var(--bg-surface); padding: 16px; border-radius: 8px; border: 1px solid var(--border); }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 500; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border); transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: var(--text-muted); transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(18px); background-color: var(--white); }

        .btn-primary { background: var(--accent); color: var(--white); border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

        /* Right Panel - Output */
        .output-panel { flex: 1; background: var(--bg-main); display: flex; flex-direction: column; padding: 30px; position: relative; overflow-y: auto;}
        
        .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .output-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .live-tag { background: rgba(59, 130, 246, 0.1); color: var(--accent); padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; border: 1px solid rgba(59, 130, 246, 0.3); }

        /* View Modes */
        .view-mode { display: none; width: 100%; height: 100%; flex-direction: column; gap: 20px; }
        .view-mode.active { display: flex; }

        /* Iframe Mode */
        .iframe-wrapper { flex: 1; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--bg-surface); display: flex; align-items: center; justify-content: center; position: relative; }
        .iframe-wrapper iframe { width: 100%; height: 100%; border: none; }
        .iframe-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); z-index: 5; transition: opacity 0.3s; }
        .iframe-overlay.hidden { opacity: 0; pointer-events: none; }
        .success-toast { background: var(--success); color: var(--bg-main); padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 14px; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3); transform: translateY(20px); opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .success-toast.show { transform: translateY(0); opacity: 1; }

        /* Terminal Mode */
        .terminal { flex: 1; background: var(--terminal-bg); border-radius: 12px; border: 1px solid var(--border); padding: 20px; font-family: 'Fira Code', monospace; font-size: 14px; overflow-y: auto; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        .terminal-top { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot.r { background: #ef4444; } .dot.y { background: #f59e0b; } .dot.g { background: #10b981; }
        
        .json-key { color: #8b5cf6; }
        .json-string { color: #10b981; }
        .json-number { color: #f59e0b; }
        .json-boolean { color: #3b82f6; }
        
        .loader { border: 3px solid var(--border); border-top: 3px solid var(--white); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 900px) {
            .workspace { flex-direction: column; overflow-y: auto; }
            .control-panel { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
            .output-panel { height: 600px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            Agency Router Ops
        </div>
        <div class="status-badge">
            <div class="pulse"></div>
            n8n Core Online
        </div>
    </header>

    <div class="workspace">
        <!-- Input Panel -->
        <div class="control-panel">
            <h2 class="panel-title">Payload Configurator</h2>
            
            <div class="form-group">
                <label>Target Destination CRM</label>
                <select id="destinationSelect" onchange="toggleViewMode()">
                    <option value="airtable">Airtable (Visual Database)</option>
                    <option value="clickup">ClickUp (Visual Kanban)</option>
                    <option value="gohighlevel">GoHighLevel (API Payload)</option>
                    <option value="hubspot">HubSpot (API Payload)</option>
                    <option value="asana">Asana (API Payload)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Raw Input Payload</label>
                <textarea id="payloadInput" placeholder="Paste unstructured data here...&#10;&#10;Example:&#10;'Hey team, John Smith here (john@test.com). I need a quote for an AC repair ASAP, it's leaking water everywhere. Budget is around $500. Text me at 555-0192.'"></textarea>
            </div>

            <!-- Optional Features to show flexibility -->
            <div class="form-group">
                <label>Processing Parameters</label>
                <div class="toggles">
                    <div class="toggle-row">
                        Detect Intent / Urgency
                        <label class="switch"><input type="checkbox" id="toggleIntent" checked><span class="slider"></span></label>
                    </div>
                    <div class="toggle-row">
                        Trigger SMS Alert to Owner
                        <label class="switch"><input type="checkbox" id="toggleSms"><span class="slider"></span></label>
                    </div>
                    <div class="toggle-row">
                        Check for Existing Record
                        <label class="switch"><input type="checkbox" id="toggleDuplicate" checked><span class="slider"></span></label>
                    </div>
                </div>
            </div>

            <button class="btn-primary" id="processBtn" onclick="sendPayload()">
                <div class="loader" id="btnLoader"></div>
                <span id="btnText">Process & Route Payload</span>
            </button>
        </div>

        <!-- Output Panel -->
        <div class="output-panel">
            <div class="output-header">
                <div class="output-title">
                    Live System Monitor
                    <span class="live-tag" id="modeTag">VISUAL MODE</span>
                </div>
            </div>

            <!-- Visual Mode (Iframes) -->
            <div id="visualMode" class="view-mode active">
                <div class="iframe-wrapper">
                    <div class="iframe-overlay" id="iframeOverlay">
                        <div class="success-toast" id="successToast">? Payload Routed Successfully!</div>
                    </div>
                    <!-- REPLACE THIS SRC WITH YOUR AIRTABLE OR CLICKUP EMBED LINK -->
                    <iframe id="crmIframe" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ2No54tpOdLhI3xUyJf0few-si1qAvoKpib1KIuZM7AlQiJElqZCGtOXKL1PQQqC1vtlB3IyA4wdmW/pubhtml?gid=382702241&amp;single=true&amp;widget=true&amp;headers=false"></iframe>
                </div>
            </div>

            <!-- API Mode (Terminal) -->
            <div id="apiMode" class="view-mode">
                <div class="terminal">
                    <div class="terminal-top">
                        <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
                    </div>
                    <pre id="terminalOutput" style="margin:0; white-space: pre-wrap; word-wrap: break-word;">Awaiting API Request...</pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- YOUR NGROK WEBHOOK URL ---
        const N8N_ROUTER_WEBHOOK = "https://helper-rubbing-refrain.ngrok-free.dev/webhook/agency-router";

        function toggleViewMode() {
            const dest = document.getElementById("destinationSelect").value;
            const visualMode = document.getElementById("visualMode");
            const apiMode = document.getElementById("apiMode");
            const modeTag = document.getElementById("modeTag");

            if (dest === "airtable" || dest === "clickup") {
                visualMode.classList.add("active");
                apiMode.classList.remove("active");
                modeTag.innerText = "VISUAL MODE";
            } else {
                visualMode.classList.remove("active");
                apiMode.classList.add("active");
                modeTag.innerText = "API TRACE MODE";
            }
        }

        // Simple syntax highlighter for the terminal output
        function syntaxHighlight(json) {
            if (typeof json != 'string') {
                 json = JSON.stringify(json, undefined, 2);
            }
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                var cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-boolean';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        async function sendPayload() {
            const btn = document.getElementById("processBtn");
            const btnText = document.getElementById("btnText");
            const loader = document.getElementById("btnLoader");
            const terminalOut = document.getElementById("terminalOutput");
            
            const payload = document.getElementById("payloadInput").value.trim();
            const destination = document.getElementById("destinationSelect").value;
            
            // Toggles
            const checkIntent = document.getElementById("toggleIntent").checked;
            const triggerSms = document.getElementById("toggleSms").checked;
            const checkDuplicate = document.getElementById("toggleDuplicate").checked;

            if (!payload) {
                alert("Please paste some raw data to process.");
                return;
            }

            // Lock UI
            btn.disabled = true;
            btnText.innerText = "Routing payload...";
            loader.style.display = "block";
            terminalOut.innerHTML = "<span style='color: #94a3b8'>&gt; Transmitting payload to n8n orchestration layer...</span>";

            try {
                const response = await fetch(N8N_ROUTER_WEBHOOK, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "ngrok-skip-browser-warning": "true"
                    },
                    body: JSON.stringify({
                        destination: destination,
                        raw_text: payload,
                        settings: {
                            detect_intent: checkIntent,
                            trigger_sms: triggerSms,
                            check_duplicates: checkDuplicate
                        }
                    })
                });

                const data = await response.json();

                // If in API mode, print beautiful JSON
                if (destination !== "airtable" && destination !== "clickup") {
                    terminalOut.innerHTML = "<span style='color: #10b981'>&gt; Status 200 OK: Payload Successfully Routed</span>\n\n" + syntaxHighlight(data);
                } else {
                    // If in visual mode, show the success animation over the iframe
                    const overlay = document.getElementById("iframeOverlay");
                    const toast = document.getElementById("successToast");
                    
                    overlay.classList.remove("hidden");
                    setTimeout(() => toast.classList.add("show"), 100);

                    // Auto hide overlay after 3 seconds so they can view the updated iframe
                    setTimeout(() => {
                        toast.classList.remove("show");
                        setTimeout(() => overlay.classList.add("hidden"), 300);
                        
                        // Optional: Force reload the iframe so Airtable/Clickup fetches the newest row
                        const iframe = document.getElementById("crmIframe");
                        iframe.src = iframe.src; 
                    }, 3000);
                }

            } catch (error) {
                terminalOut.innerHTML = "<span style='color: #ef4444'>&gt; ERROR: Connection to n8n backend failed. Ensure ngrok is running.</span>";
                alert("Backend offline. Please start ngrok.");
            } finally {
                // Unlock UI
                btn.disabled = false;
                btnText.innerText = "Process & Route Payload";
                loader.style.display = "none";
            }
        }
    </script>
</body>
</html>
